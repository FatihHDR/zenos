# Template only — do NOT commit real values.
# Create the real Secret with:
#
#   kubectl -n zenos create secret generic zenos-secrets \
#     --from-literal=INITIAL_PASSWORD='<9router dashboard password>' \
#     --from-literal=OPENAI_API_KEY='<9router API key>'
#
# Keys consumed:
#   INITIAL_PASSWORD -> 9router first-login password
#   OPENAI_API_KEY   -> Zenos app -> 9router API key (used by api.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: zenos-secrets
  namespace: zenos
type: Opaque
stringData:
  INITIAL_PASSWORD: "change-me"
  OPENAI_API_KEY: "change-me"
